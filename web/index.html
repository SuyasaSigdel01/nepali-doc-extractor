<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>बिल पढ्नुहोस्</title>
<style>
  :root { --bg:#0f1419; --card:#1a2028; --line:#2a323c;
          --fg:#e8eaed; --muted:#9aa4b2; --accent:#4a9d7f; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font-family:system-ui,"Noto Sans Devanagari",sans-serif; line-height:1.5; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.85rem; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:14px; margin-bottom:14px; }
  label.shoot { display:block; text-align:center; padding:18px;
                border:2px dashed var(--line); border-radius:12px;
                cursor:pointer; color:var(--muted); margin-bottom:12px; }
  input[type=file] { display:none; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px;
           padding:12px 16px; font-size:1rem; width:100%; cursor:pointer; }
  button[disabled] { opacity:.5; }
  .tabs { display:flex; gap:8px; margin-bottom:10px; }
  .tabs button { background:transparent; border:1px solid var(--line); color:var(--muted); }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:.9rem; margin-top:12px; }
  td { padding:6px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  td.k { color:var(--muted); width:45%; }
  audio { width:100%; margin-top:10px; }
  img.preview { width:100%; border-radius:8px; margin-bottom:12px; }
  .err { color:#e0776b; }
  .hide { display:none; }
</style>
</head>
<body>

<h1>बिल पढ्नुहोस्</h1>
<div class="sub">Photograph a Khanepani bill — it will be read back in Nepali or English.</div>

<div class="card">
  <label class="shoot" for="file">फोटो खिच्नुहोस् / Choose a photo</label>
  <input id="file" type="file" accept="image/*" capture="environment">
  <img id="preview" class="preview hide" alt="">
  <button id="go" disabled>पढ्नुहोस् / Read it</button>
</div>

<div id="status" class="card hide"></div>

<div id="result" class="card hide">
  <div class="tabs">
    <button id="ne" class="on">नेपाली</button>
    <button id="en">English</button>
  </div>
  <p id="explain"></p>
  <audio id="audio" controls></audio>
  <table id="fields"></table>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let data = null, lang = "ne";

$("file").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  $("preview").src = URL.createObjectURL(f);
  $("preview").classList.remove("hide");
  $("go").disabled = false;
};

$("go").onclick = async () => {
  const f = $("file").files[0];
  if (!f) return;

  $("go").disabled = true;
  $("result").classList.add("hide");
  show("पढ्दै छ… reading the bill, this takes a moment.");

  const body = new FormData();
  body.append("file", f);

  try {
    const res = await fetch("/extract", { method: "POST", body });
    const json = await res.json();
    if (!res.ok) throw new Error(json.detail || res.statusText);
    data = json;
    $("status").classList.add("hide");
    $("result").classList.remove("hide");
    render();
  } catch (err) {
    show("पढ्न सकिएन / Could not read it: " + err.message, true);
  } finally {
    $("go").disabled = false;
  }
};

function show(msg, bad) {
  $("status").textContent = msg;
  $("status").className = "card" + (bad ? " err" : "");
}

for (const l of ["ne", "en"]) {
  $(l).onclick = () => {
    lang = l;
    $("ne").className = l === "ne" ? "on" : "";
    $("en").className = l === "en" ? "on" : "";
    render();
  };
}

function render() {
  if (!data) return;
  $("explain").textContent = (data.explanations[lang] || []).join(" ");
  $("audio").src = data.audio[lang];
  $("fields").innerHTML = Object.entries(data.fields)
    .map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>`)
    .join("");
}
</script>
</body>
</html>
